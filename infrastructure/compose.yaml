name: smart-commerce-local

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD no arquivo local}
      DB_NAME: ${DB_NAME:-smart_commerce}
      DB_USERNAME: ${DB_USERNAME:-smart_commerce}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"

volumes:
  postgres_data:
