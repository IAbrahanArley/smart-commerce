spring:
  application:
    name: smart-commerce
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0B
      resolve-lazily: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        # MVP block 2: PostgreSQL errors never carry the "Failing row contains (...)" detail, which
        # holds whole rows (buyer e-mail, phone, address) and would reach logs with the exception.
        logServerErrorDetail: false
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
logging:
  pattern:
    # MVP block 2: every line of a request carries its correlation id (RequestIdFilter).
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      tracking-modes: cookie
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
orders:
  checkout:
    # D6: checkout creates real pending orders and reservations but there is no payment yet.
    # Never enable it outside DEV/local until the payment integration exists.
    enabled: ${ORDERS_CHECKOUT_ENABLED:false}
  maintenance:
    # SC-010: expiration every minute and D2 anonymization once a day, in this process. Several
    # instances are safe (SKIP LOCKED and compare-and-set).
    enabled: ${ORDERS_MAINTENANCE_ENABLED:true}
    expiration-interval: PT1M
    anonymization-interval: PT24H
    anonymization-initial-delay: PT10M
  client-ip:
    # D4: shared with the storefront-web server to sign the visitor IP (>= 32 characters).
    secret: ${STOREFRONT_FORWARDING_SECRET:}
storefront:
  revalidation:
    # SC-047: internal origin of storefront-web (for example http://storefront:3001) and a secret
    # of at least 32 characters shared only with it. Empty: pages refresh by time (60 s) only.
    url: ${STOREFRONT_REVALIDATION_URL:}
    secret: ${STOREFRONT_REVALIDATION_SECRET:}
identity:
  public-origin: ${IDENTITY_PUBLIC_ORIGIN:http://127.0.0.1:3000}
  secure-cookies: ${IDENTITY_SECURE_COOKIES:false}
  mail:
    directory: ${IDENTITY_MAIL_DIRECTORY:}
    # ADR-0014 H1, outside dev only: "brevo" sends through Brevo's HTTP API (SMTP is blocked on
    # Render free). Empty keeps registration mail unavailable. Never version the API key.
    provider: ${IDENTITY_MAIL_PROVIDER:}
    sender-email: ${IDENTITY_MAIL_SENDER_EMAIL:}
    sender-name: ${IDENTITY_MAIL_SENDER_NAME:Smart Commerce}
    brevo:
      api-key: ${IDENTITY_MAIL_BREVO_API_KEY:}
payments:
  # SC-012 (ADR-0013 P3, P10): Mercado Pago OAuth with PKCE, sandbox only. Setting the client id
  # enables the integration; then the secret, the redirect URI (admin origin +
  # /api/payments/mercado-pago/callback, registered in the application) and the key are required.
  # Never version any of these values.
  mercado-pago:
    client-id: ${MERCADO_PAGO_CLIENT_ID:}
    client-secret: ${MERCADO_PAGO_CLIENT_SECRET:}
    redirect-uri: ${MERCADO_PAGO_REDIRECT_URI:}
    # P10: request test tokens. Production requires a separate approval.
    test-token: ${MERCADO_PAGO_TEST_TOKEN:true}
    # SC-013: public HTTPS origin of storefront-web for the Checkout Pro return page. Empty or
    # HTTP (local development) sends no return URLs: the provider rejects local addresses.
    return-origin: ${STOREFRONT_PUBLIC_ORIGIN:}
    # SC-014: secret of the application's webhook (panel > Webhooks). Empty turns the webhook
    # endpoint off; payments are then confirmed by querying the provider (SC-015).
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    # ADR-0013 (P1 change): public HTTPS URL of the webhook (backend origin +
    # /api/public/webhooks/mercado-pago) sent with each preference, so payments of every
    # connected seller notify this platform. Empty relies on the application's panel setting.
    notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
  # AES-256-GCM key for provider tokens at rest: 32 random bytes in Base64.
  token-encryption-key: ${PAYMENTS_TOKEN_ENCRYPTION_KEY:}
  token-refresh:
    enabled: ${PAYMENTS_TOKEN_REFRESH_ENABLED:true}
  events:
    # SC-014: processes stored notifications (query the provider, confirm, deduct stock).
    enabled: ${PAYMENTS_EVENTS_ENABLED:true}
    interval: PT10S
  reconciliation:
    # SC-015: queries the provider for orders still waiting; the main path without a webhook (P6).
    enabled: ${PAYMENTS_RECONCILIATION_ENABLED:true}
    interval: PT1M
billing:
  # SC-031 (ADR-0017): plan limits, trial and account standing. Off by default; switching it on
  # requires the Stripe keys below, so owners can pay before the trial ends (SC-032).
  enabled: ${BILLING_ENABLED:false}
  trial-days: ${BILLING_TRIAL_DAYS:14}
  grace-days: ${BILLING_GRACE_DAYS:7}
  # SC-032 (ADR-0017 B11, B12): Stripe Billing. Required once billing is on; production takes only
  # live keys and every other environment only test keys. Set in the environment panel, never here.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
advisor:
  # SC-025 (ADR-0016 A8, A11): the assistant is off by default. The quota counts questions per
  # store per calendar month (São Paulo); the cap stops every store once the platform's estimated
  # spend of the month reaches it.
  enabled: ${ADVISOR_ENABLED:false}
  monthly-question-quota: ${ADVISOR_MONTHLY_QUOTA:100}
  global-monthly-cap-usd: ${ADVISOR_GLOBAL_MONTHLY_CAP_USD:20.00}
  # SC-026 (A1, A2, A11): Claude model and key. Without the key the assistant is unavailable even
  # with ADVISOR_ENABLED=true. The key is created by the owner in the Anthropic console and set
  # only in the environment panel; never version it. base-url is for test fakes only. Sonnet 5.5 is
  # the launch model (owner decision 2026-10-26, PRICING_PROPOSAL.md); Opus 5.5 stays selectable.
  model: ${ADVISOR_MODEL:claude-sonnet-5-5}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ADVISOR_ANTHROPIC_BASE_URL:}
  housekeeping:
    enabled: ${ADVISOR_HOUSEKEEPING_ENABLED:true}
deployment:
  # ADR-0014 H2: "hosted-test" marks the hosted test environment, the only place outside dev
  # where checkout may be enabled without payments. Any other value keeps D6 strict.
  environment: ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
orders:
  checkout:
    # D6: local development only; the dev profile is never used outside the developer machine.
    enabled: ${ORDERS_CHECKOUT_ENABLED:true}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    supported-submit-methods: []
    persist-authorization: false
    validator-url: none
